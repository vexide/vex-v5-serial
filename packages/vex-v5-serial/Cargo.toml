[package]
name = "vex-v5-serial"
version = "0.5.1"
edition = "2024"
license = "MIT"
description = "A library for communicating with VEX V5 Brains."
repository = "https://github.com/vexide/vex-v5-serial"
authors = ["vexide", "Gavin Niederman <gavinniederman@gmail.com>", "Tropical"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# We depend on this because for some reason it fixes an issue with tokio-serial.
vex-cdc = { workspace = true }
log = "0.4.34"
thiserror = "2"

tokio-stream = { version = "0.1.19", default-features = false, optional = true }
async-serial = { version = "0.2.0", default-features = false, optional = true }
serialport = { version = "4.9.0", optional = true, features = [
    "usbportinfo-interface",
] }
btleplug = { version = "0.13.2", optional = true }
futures = { version = "0.3.30", default-features = false, optional = true }
futures-timer = { version = "3.0.4", optional = true }
uuid = { version = "1", default-features = false, optional = true }
image = { version = "0.25.10", default-features = false, optional = true }
flate2 = { version = "1.1.10", optional = true }

[features]
default = ["serial", "bluetooth"]
serial = ["dep:async-serial", "dep:futures-timer", "dep:serialport"]
bluetooth = [
    "dep:futures-timer",
    "dep:tokio-stream",
    "dep:btleplug",
    "dep:futures",
    "dep:uuid",
]
screen-commands = ["dep:image"]
file-commands = ["dep:flate2"]
