[package]
name = "vex-serial"
version = "0.5.1"
edition = "2024"
license = "MIT"
description = "A library for communicating with VEX Robotics products."
repository = "https://github.com/vexide/vex-v5-serial"
authors = ["vexide", "Gavin Niederman <gavinniederman@gmail.com>", "Tropical"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
vex-cdc = { workspace = true }
log = "0.4"
thiserror = "2"

serialport = { version = "4.9.0", default-features = false, features = [
    "usbportinfo-interface",
], optional = true }
futures-util = { version = "0.3", features = ["io"], optional = true }
async-io = { version = "2.6.0", optional = true }
btleplug = { version = "0.13.2", optional = true }
uuid = { version = "1", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nusb = { version = "0.2.9", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
blocking = { version = "1.7.0", optional = true }

[features]
default = ["serial-blocking"]
serial-blocking = ["dep:serialport", "dep:nusb"]
serial-async = [
    "dep:futures-util",
    "dep:async-io",
    "dep:serialport",
    "dep:nusb",
    "dep:blocking",
]
bluetooth = ["dep:futures-util", "dep:btleplug", "dep:uuid"]
